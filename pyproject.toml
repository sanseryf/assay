[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay"
version = "0.3.0"
description = "JSON payload error identifier: every error, pinned to a path, grouped by root cause"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zachery" }]
keywords = ["json", "validation", "schema", "diagnostics", "data-quality"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "jsonschema[format]>=4.22",
    "typer>=0.29",
    "rich>=13.7",
    "ftfy>=6.3.1",
    "pyyaml>=6.0.4",
    "pydantic>=2.14.4",
    "usaddress>=0.5.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
assay = "assay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001: this project talks about curly quotes on purpose.
# B008: Typer's documented API puts Argument/Option calls in the signature.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/assay/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/assay"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "click.*", "ftfy.*", "usaddress.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["assay"]
branch = true

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20261122",
]
