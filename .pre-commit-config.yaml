# Hooks run in the project environment, so they use the same ruff and mypy as CI.
# Enable them once per clone: `uv run pre-commit install`
default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --force-exclude
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
